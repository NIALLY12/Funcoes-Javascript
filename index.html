<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFatos - Curiosidades do Cinema</title>
    <style>
        /* Variáveis de cores para os Temas */
        :root {
            --bg-body: #141414;
            --bg-card: #181818;
            --bg-box: #202020;
            --text-main: #ffffff;
            --text-sub: #aaa;
            --border: #282828;
            --primary: #e50914;
        }

        [data-theme="light"] {
            --bg-body: #f4f4f9;
            --bg-card: #ffffff;
            --bg-box: #f0f0f5;
            --text-main: #141414;
            --text-sub: #555555;
            --border: #e0e0e0;
            --primary: #007bff;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
        }

        /* Botão flutuante de Tema no topo superior direito */
        .btn-tema {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .container-cinema {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-top: 4px solid var(--primary);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitulo {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 25px;
        }

        .caixa-mensagem {
            background-color: var(--bg-box);
            padding: 20px;
            border-radius: 8px;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 25px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        /* Layout dos botões funcionais */
        .botoes-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-cinema {
            background-color: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-cinema:hover {
            filter: brightness(1.1);
            transform: scale(1.03);
        }

        .btn-cinema:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background-color: #333;
            color: #fff;
        }
        [data-theme="light"] .btn-reset {
            background-color: #6c757d;
        }
    </style>
</head>
<body>

    <!-- Botão de Alternar Tema -->
    <button class="btn-tema" id="toggle-tema">🌓 Modo Claro</button>

    <div class="container-cinema">
        <h1>CineFatos 🍿</h1>
        <p class="subtitulo" id="contador-info">Início da sessão</p>
        
        <!-- Área onde a mensagem será exibida -->
        <p class="caixa-mensagem" id="mensagem-filme">Clique em "Próxima" para começar a gerar curiosidades surpreendentes sobre o cinema!</p>
        
        <!-- Controles de Navegação -->
        <div class="botoes-container">
            <button class="btn-cinema" id="btn-anterior" disabled>⬅️ Anterior</button>
            <button class="btn-cinema" id="btn-proximo">Próxima ➡️</button>
            <button class="btn-cinema btn-reset" id="btn-reset" disabled>Reiniciar ✖️</button>
        </div>
    </div>

    <script>
        // 1. Elementos do HTML
        const mensagemEl = document.getElementById("mensagem-filme");
        const contadorInfo = document.getElementById("contador-info");
        const botaoTema = document.getElementById("toggle-tema");
        const btnAnterior = document.getElementById("btn-anterior");
        const btnProximo = document.getElementById("btn-proximo");
        const btnReset = document.getElementById("btn-reset");

        // 2. Lista com exatamente 20 curiosidades do cinema
        const fatosCinema = [
            "🎬 No filme 'Interstellar', as plantações de milho eram reais! O diretor Christopher Nolan plantou 500 acres de milho para depois vendê-los.",
            "🦖 O som dos dinossauros em 'Jurassic Park' foi feito usando gravações de tartarugas se acasalando, baleias e jacarés.",
            "👽 Em 'E.T.: O Extraterrestre', o rosto do alienígena foi inspirado nas feições do poeta Carl Sandburg, de Albert Einstein e de um cachorro pug.",
            "🍫 A famosa cachoeira de chocolate do filme 'A Fantástica Fábrica de Chocolate' (1971) era feita de água de verdade misturada com chocolate e creme.",
            "🎭 O ator Heath Ledger viveu sozinho em um hotel por cerca de um mês para construir a mente e a risada icônica do Coringa em 'Batman'.",
            "🕰️ O filme 'De Volta para o Futuro' originalmente teria uma geladeira como máquina do tempo em vez do famoso carro DeLorean.",
            "🤫 O filme 'Um Lugar Silencioso' tem apenas cerca de 25 linhas de diálogos falados em toda a sua duração.",
            "🚗 Em 'Velozes e Furiosos 7', mais de 230 carros reais foram destruídos durante as gravações das cenas de ação.",
            "💇 Em 'V de Vingança', a cena em que a atriz Natalie Portman tem sua cabeça raspada de verdade foi filmada em apenas um único take.",
            "🦁 O rugido do leão no início dos filmes da MGM não é de um leão! O som foi criado usando rugidos modificados de um tigre.",
            "🎈 No filme 'Up: Altas Aventuras', os produtores calcularam que seriam necessários mais de 25 milhões de balões reais para erguer a casa.",
            "⚡ Daniel Radcliffe usou e gastou mais de 160 pares de óculos e cerca de 80 varinhas durante as filmagens de toda a saga Harry Potter.",
            "🤡 Para o filme 'It: A Coisa', Bill Skarsgård assustou tanto as crianças figurantes no set que algumas choraram de verdade ao vê-lo caracterizado.",
            "🦾 Arnold Schwarzenegger recebeu cerca de 15 milhões de dólares para atuar em 'Exterminador do Futuro 2', onde falou apenas 700 palavras.",
            "🧥 O casaco clássico usado por Harrison Ford em 'Indiana Jones' foi comprado em uma loja comum de departamentos de Londres antes das filmagens.",
            "🥬 O som de ossos quebrando em filmes de terror é frequentemente feito esmagando cabeças de aipo ou alface no estúdio.",
            "🧊 No filme 'Titanic', a água no tanque onde os atores gravavam as cenas pós-naufrágio estava morna para manter o elenco confortável.",
            "🪐 A icônica respiração de Darth Vader em 'Star Wars' foi criada colocando um regulador de mergulho dentro de um microfone de estúdio.",
            "🥊 Sylvester Stallone escreveu o roteiro original do primeiro filme 'Rocky: Um Lutador' em apenas três dias.",
            "🐈 O gato que Marlon Brando segura em 'O Poderoso Chefão' era um animal de rua que entrou no estúdio e o diretor resolveu colocá-lo na cena."
        ];

        // 3. Estrutura de histórico para permitir voltar sem repetir e sem perder a ordem gerada
        let ordemSorteada = [];
        let posicaoAtual = -1;
        let easterEggAtivo = false;

        // Função para sortear uma ordem aleatória única dos 20 fatos (Embaralhamento)
        function inicializarOrdem() {
            ordemSorteada = [...Array(fatosCinema.length).keys()];
            // Algoritmo para embaralhar a lista de índices de forma justa
            for (let i = ordemSorteada.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [ordemSorteada[i], ordemSorteada[j]] = [ordemSorteada[j], ordemSorteada[i]];
            }
            posicaoAtual = -1;
            easterEggAtivo = false;
        }

        // Inicializa o jogo pela primeira vez
        inicializarOrdem();

        // 4. Função principal que renderiza o estado da tela
        function atualizarInterface() {
            if (easterEggAtivo) {
                mensagemEl.innerHTML = "✨ <b>EASTER EGG DESBLOQUEADO!</b> ✨<br><br>Parabéns, cinéfilo! Você consumiu todo o nosso estoque de conhecimento cinematográfico. Vá pegar mais pipoca, o filme acabou! 🎬🎬";
                contadorInfo.textContent = "Fim da sessão!";
                btnAnterior.disabled = true;
                btnProximo.disabled = true;
                btnReset.disabled = false;
                return;
            }

            if (posicaoAtual === -1) {
                mensagemEl.textContent = "Clique em \"Próxima\" para começar a gerar curiosidades surpreendentes sobre o cinema!";
                contadorInfo.textContent = "Início da sessão";
                btnAnterior.disabled = true;
